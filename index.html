<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 여행</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; /* 기본 스크롤 막기 */
            height: 100vh;
        }

        /* ===== 첫 화면 ===== */
        .hero {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .hero.hide {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        .hero-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .hero-slide.active {
            opacity: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        /* 글자 - 왼쪽에 완전히 붙임 */
        .hero-text {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            padding-left: 40px;
            color: white;
            z-index: 2;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.7s ease;
        }

        .hero-text.hide {
            transform: translateY(-50%) translateX(100vw); /* 오른쪽으로 사라짐 */
            opacity: 0;
        }

        .hero-text p {
            font-size: 2.4rem;
            font-weight: 600;
            line-height: 1.5;
            margin: 0;
        }

        .scroll-down {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 0.9rem;
            letter-spacing: 2px;
            z-index: 2;
            opacity: 0.8;
            transition: opacity 0.5s;
        }

        .hero.hide .scroll-down {
            opacity: 0;
        }

        /* ===== 두 번째 페이지 ===== */
        .section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 5;
        }

        .section.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .section-content {
            max-width: 700px;
            text-align: center;
            padding: 20px;
        }

        .section-content h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: #222;
        }

        .section-content p {
            font-size: 1.15rem;
            color: #555;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <!-- 첫 화면 -->
    <section class="hero" id="hero">
        <img src="https://picsum.photos/id/1015/1920/1080" class="hero-slide active" alt="여행지1">
        <img src="https://picsum.photos/id/1016/1920/1080" class="hero-slide" alt="여행지2">
        <img src="https://picsum.photos/id/1018/1920/1080" class="hero-slide" alt="여행지3">
        <img src="https://picsum.photos/id/1020/1920/1080" class="hero-slide" alt="여행지4">
        <img src="https://picsum.photos/id/1036/1920/1080" class="hero-slide" alt="여행지5">

        <div class="hero-overlay"></div>

        <div class="hero-text" id="heroText">
            <p>남들과는 다른</p>
            <p>나만의 관광지</p>
            <p>나만의 여행</p>
            <p>나만의 일정</p>
        </div>

        <div class="scroll-down">↓ Scroll</div>
    </section>

    <!-- 두 번째 페이지 -->
    <section class="section" id="section">
        <div class="section-content">
            <h2>나만의 여행을 시작하세요</h2>
            <p>
                여기는 내가 개인적으로 실험하고 기록하는 공간입니다.<br>
                앞으로 여러 여행지와 일정, 그리고 특별한 경험들을 담아볼 예정입니다.
            </p>
        </div>
    </section>

    <script>
        const hero = document.getElementById('hero');
        const heroText = document.getElementById('heroText');
        const section = document.getElementById('section');
        const slides = document.querySelectorAll('.hero-slide');

        let currentSlide = 0;
        let isAnimating = false;
        let currentPage = 1; // 1: 첫 화면, 2: 두 번째 화면

        // 이미지 자동 슬라이드
        setInterval(() => {
            if (currentPage !== 1) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 4000);

        // 휠 이벤트 감지
        window.addEventListener('wheel', (e) => {
            if (isAnimating) return;

            if (e.deltaY > 0 && currentPage === 1) {
                // 아래로 스크롤 → 두 번째 페이지로
                goToPage2();
            } else if (e.deltaY < 0 && currentPage === 2) {
                // 위로 스크롤 → 첫 페이지로
                goToPage1();
            }
        }, { passive: true });

        function goToPage2() {
            isAnimating = true;
            currentPage = 2;

            // 글자 오른쪽으로 사라지기
            heroText.classList.add('hide');

            // 이미지 + 히어로 사라지기
            setTimeout(() => {
                hero.classList.add('hide');
                section.classList.add('show');
            }, 200);

            setTimeout(() => {
                isAnimating = false;
            }, 900);
        }

        function goToPage1() {
            isAnimating = true;
            currentPage = 1;

            // 두 번째 페이지 숨기기
            section.classList.remove('show');

            // 히어로 + 이미지 다시 나타나기
            hero.classList.remove('hide');

            // 글자 왼쪽에서 다시 나타나기
            setTimeout(() => {
                heroText.classList.remove('hide');
            }, 150);

            setTimeout(() => {
                isAnimating = false;
            }, 900);
        }
    </script>

</body>
</html>
