<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 실험실</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #f5f5f5;
        }

        /* 배너 전체 */
        .banner {
            background-color: #2c3e50;
            padding: 12px 0;
            display: flex;
            justify-content: center;
        }

        /* 광고 영역 */
        .banner-inner {
            width: calc(100% - 280px);
            max-width: 900px;
            height: 180px;
            overflow: hidden;
            position: relative;
            border-radius: 6px;
        }

        /* 이미지 */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .slide.active {
            opacity: 1;
        }

        /* 좌우 화살표 */
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            border: none;
            font-size: 28px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .arrow:hover {
            background-color: rgba(0, 0, 0, 0.6);
        }

        .arrow.prev {
            left: 10px;
        }

        .arrow.next {
            right: 10px;
        }

        /* 하단 동그라미들 */
        .dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.3s;
            opacity: 0.8;
        }

        .dot.active {
            background-color: #888; /* 현재 이미지일 때 회색 */
            opacity: 1;
        }

        /* 본문 */
        .content {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- 배너 -->
    <div class="banner">
        <div class="banner-inner">
            <!-- 이미지들 (원하는 만큼 추가 가능) -->
            <img src="https://picsum.photos/id/1015/1200/400" class="slide active" alt="상품1">
            <img src="https://picsum.photos/id/1016/1200/400" class="slide" alt="상품2">
            <img src="https://picsum.photos/id/1018/1200/400" class="slide" alt="상품3">
            <img src="https://picsum.photos/id/1020/1200/400" class="slide" alt="상품4">

            <!-- 좌우 화살표 -->
            <button class="arrow prev">‹</button>
            <button class="arrow next">›</button>

            <!-- 하단 동그라미 -->
            <div class="dots"></div>
        </div>
    </div>

    <!-- 본문 -->
    <div class="content">
        <h2>여행을 시작하는 가장 쉬운방법</h2>
        <p>내일의 나를 위해 오늘의 행복을 즐겨주세요</p>
        <p>앞으로 여러 가지를 테스트하고 기록을 남겨볼 예정입니다.</p>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.querySelector('.dots');
        const prevBtn = document.querySelector('.arrow.prev');
        const nextBtn = document.querySelector('.arrow.next');

        let current = 0;
        let autoPlay;

        // 동그라미 생성
        slides.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(index));
            dotsContainer.appendChild(dot);
        });

        const dots = document.querySelectorAll('.dot');

        // 특정 슬라이드로 이동
        function goToSlide(index) {
            slides[current].classList.remove('active');
            dots[current].classList.remove('active');

            current = index;

            slides[current].classList.add('active');
            dots[current].classList.add('active');

            resetAutoPlay();
        }

        // 다음 슬라이드
        function nextSlide() {
            let next = (current + 1) % slides.length;
            goToSlide(next);
        }

        // 이전 슬라이드
        function prevSlide() {
            let prev = (current - 1 + slides.length) % slides.length;
            goToSlide(prev);
        }

        // 자동 재생
        function startAutoPlay() {
            autoPlay = setInterval(nextSlide, 2500); // 2.5초
        }

        function resetAutoPlay() {
            clearInterval(autoPlay);
            startAutoPlay();
        }

        // 버튼 이벤트
        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);

        // 시작
        startAutoPlay();
    </script>

</body>
</html>
