<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이지트립</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            background: #111;
            touch-action: none; /* 모바일 기본 스크롤 방지 */
        }

        .page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.7s ease;
            z-index: 1;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        /* 1페이지 */
        #page1 {
            background: #000;
        }

        .hero-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .hero-slide.active {
            opacity: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .hero-text {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            padding-left: 24px;
            color: white;
            z-index: 2;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.7s ease;
        }

        .hero-text.hide {
            transform: translateY(-50%) translateX(100vw);
            opacity: 0;
        }

        .hero-text p {
            font-size: 1.8rem;
            font-weight: 600;
            line-height: 1.5;
            margin: 0;
        }

        .scroll-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 0.9rem;
            letter-spacing: 2px;
            z-index: 2;
            opacity: 0.8;
        }

        /* 2페이지 */
        #page2 {
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page2-content {
            text-align: center;
            max-width: 900px;
            padding: 20px;
        }

        .page2-line {
            margin: 16px 0;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.7s ease;
            opacity: 1;
            transform: translateX(0);
        }

        .page2-line.hide-right {
            transform: translateX(120%);
            opacity: 0;
        }

        .page2-line.hide-left {
            transform: translateX(-120%);
            opacity: 0;
        }

        .page2-title {
            font-size: 2.1rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 24px;
        }

        .page2-text {
            font-size: 1.15rem;
            color: #444;
            font-weight: 500;
            line-height: 1.6;
        }

        /* 3페이지 */
        #page3 {
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .page3-content {
            text-align: center;
            max-width: 700px;
            padding: 20px;
        }

        .page3-content h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .page3-content p {
            font-size: 1.1rem;
            opacity: 0.85;
            line-height: 1.8;
        }

        /* 모바일 글씨 크기 조정 */
        @media (max-width: 600px) {
            .hero-text p {
                font-size: 1.5rem;
            }
            .page2-title {
                font-size: 1.7rem;
            }
            .page2-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- 1페이지 -->
    <section class="page active" id="page1">
        <img src="https://picsum.photos/id/1015/1920/1080" class="hero-slide active" alt="여행지1">
        <img src="https://picsum.photos/id/1016/1920/1080" class="hero-slide" alt="여행지2">
        <img src="https://picsum.photos/id/1018/1920/1080" class="hero-slide" alt="여행지3">
        <img src="https://picsum.photos/id/1020/1920/1080" class="hero-slide" alt="여행지4">
        <img src="https://picsum.photos/id/1036/1920/1080" class="hero-slide" alt="여행지5">

        <div class="hero-overlay"></div>

        <div class="hero-text" id="heroText">
            <p>남들과는 다른</p>
            <p>나만의 관광지</p>
            <p>나만의 여행</p>
            <p>나만의 일정</p>
        </div>

        <div class="scroll-hint">↓ Scroll</div>
    </section>

    <!-- 2페이지 -->
    <section class="page" id="page2">
        <div class="page2-content">
            <div class="page2-line page2-title" data-dir="right">나만의 여행을 시작하세요</div>
            <div class="page2-line page2-text" data-dir="left">여행은 다니고 싶은데 어디서부터 계획을 해야할지 모르겠을때</div>
            <div class="page2-line page2-text" data-dir="right">새로운 여행을 시도해 보고 싶을때</div>
            <div class="page2-line page2-text" data-dir="left">처음 시도하는 여행을 준비하고 싶을때</div>
            <div class="page2-line page2-text" data-dir="right">처음가는 국가의 여행을 계획할때</div>
            <div class="page2-line page2-text" data-dir="left">계획과 예약을 한번에 이지트립</div>
        </div>
    </section>

    <!-- 3페이지 -->
    <section class="page" id="page3">
        <div class="page3-content">
            <h2>이지트립과 함께</h2>
            <p>
                여행의 시작부터 끝까지<br>
                더 쉽고 특별하게 만들어 드립니다.
            </p>
        </div>
    </section>

    <script>
        const pages = [
            document.getElementById('page1'),
            document.getElementById('page2'),
            document.getElementById('page3')
        ];

        const heroText = document.getElementById('heroText');
        const page2Lines = document.querySelectorAll('.page2-line');
        const slides = document.querySelectorAll('.hero-slide');

        let currentPage = 0;
        let isAnimating = false;
        let currentSlide = 0;

        // 이미지 슬라이드
        setInterval(() => {
            if (currentPage !== 0) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 4000);

        // ===== 데스크톱 휠 =====
        window.addEventListener('wheel', (e) => {
            if (isAnimating) return;
            if (e.deltaY > 0 && currentPage < 2) goToPage(currentPage + 1);
            else if (e.deltaY < 0 && currentPage > 0) goToPage(currentPage - 1);
        }, { passive: true });

        // ===== 모바일 터치 (스와이프) =====
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (isAnimating) return;

            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;

            // 위로 스와이프 (아래로 페이지 이동)
            if (diff > 50 && currentPage < 2) {
                goToPage(currentPage + 1);
            }
            // 아래로 스와이프 (위로 페이지 이동)
            else if (diff < -50 && currentPage > 0) {
                goToPage(currentPage - 1);
            }
        }, { passive: true });

        function goToPage(index) {
            if (index === currentPage || isAnimating) return;
            isAnimating = true;

            const prev = currentPage;
            currentPage = index;

            // 1 → 2
            if (prev === 0 && index === 1) {
                heroText.classList.add('hide');
                setTimeout(() => {
                    pages[0].classList.remove('active');
                    pages[1].classList.add('active');
                    isAnimating = false;
                }, 700);
                return;
            }

            // 2 → 1
            if (prev === 1 && index === 0) {
                pages[1].classList.remove('active');
                pages[0].classList.add('active');
                setTimeout(() => {
                    heroText.classList.remove('hide');
                    isAnimating = false;
                }, 200);
                return;
            }

            // 2 → 3
            if (prev === 1 && index === 2) {
                page2Lines.forEach(line => {
                    const dir = line.dataset.dir;
                    line.classList.add(dir === 'right' ? 'hide-right' : 'hide-left');
                });
                setTimeout(() => {
                    pages[1].classList.remove('active');
                    pages[2].classList.add('active');
                    isAnimating = false;
                }, 750);
                return;
            }

            // 3 → 2
            if (prev === 2 && index === 1) {
                pages[2].classList.remove('active');
                pages[1].classList.add('active');
                setTimeout(() => {
                    page2Lines.forEach(line => {
                        line.classList.remove('hide-right', 'hide-left');
                    });
                    isAnimating = false;
                }, 50);
                return;
            }
        }
    </script>

</body>
</html>
